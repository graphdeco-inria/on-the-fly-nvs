services:

  # ── Tailscale sidecar ────────────────────────────────────────────────────────
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-on-the-fly-nvs}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY is required. Get one at https://login.tailscale.com/admin/settings/keys}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-routes
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      # SSH — mapped to 2222 on host to avoid conflicts with host sshd
      - "2222:22"
      # WebSocket viewer
      - "6009:6009"
      # HTTP viewer (http://<host>:8000/webviewer)
      - "8000:8000"
    restart: unless-stopped

  # ── on-the-fly NVS server ────────────────────────────────────────────────────
  on-the-fly-nvs:
    build: .
    image: on-the-fly-nvs:latest
    runtime: nvidia
    # Shares Tailscale container's network namespace — ports above are accessible
    # via both the host IP and the Tailscale IP of this machine.
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
      # iPhone stream URL (LAN or Tailscale IP)
      - STREAM_URL=${STREAM_URL:-}
      - MODEL_PATH=${MODEL_PATH:-/app/results}
      # SSH public key injected at container start — or mount authorized_keys below
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
    volumes:
      - model_cache:/cache
      - ./results:/app/results
      # Optional: mount authorized_keys directly instead of using SSH_PUBLIC_KEY env
      # - ~/.ssh/authorized_keys:/root/.ssh/authorized_keys:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  model_cache:
  tailscale_state:
